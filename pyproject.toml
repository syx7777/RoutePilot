[project]
name = "comboscope"
version = "0.2.0"
description = "Combo sales forecast diagnosis and experiment validation agents."
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.3.7",
  "langchain-openai>=1.3.0",
  "langgraph",
  "numpy",
  "pandas",
  "pydantic",
  "python-dotenv>=1.2.2",
  "pyyaml",
  "requests",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["comboscope*"]
